<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Colmar Academy</title>
    <style>
        .hero {
            max-width: auto;
            margin: 0 auto;
        }

        .infomation {
            max-width: auto;
            margin: 0 auto;
        }

        .hero>div {
            border: 2px solid rgb(233, 233, 233);
            border-radius: 5px;
            background-color: rgba(194, 194, 194, 0.5);
            padding: 1em;
            color: #d9480f;
        }

        .infomation>div {
            border: 2px solid rgb(233, 233, 233);
            border-radius: 5px;
            background-color: rgba(109, 107, 107, 0.603);
            color: #d9480f;
        }

        .class1 {
            grid-column: 1 / 4;
            grid-row: 1 / 4;
        }

        .class2 {
            margin-left: 72px;
            margin-right: 72px;
            grid-column: 1 / 4;
            grid-row: 1 / 4;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topnav {
            overflow: hidden;
            background-color: #ffffff;
        }

        .topnav a {
            float: left;
            display: block;
            color: #000000;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .topnav .icon {
            display: none;
        }

        .hero {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            grid-auto-rows: minmax(100px, auto);
        }

        .infomation {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            grid-auto-rows: minmax(100px, auto);
        }

        div.gallery {
            border: 1px solid #ccc;
        }

        div.gallery:hover {
            border: 1px solid #777;
        }

        div.gallery img {
            width: 100%;
            height: auto;
        }

        div.desc {
            padding: 15px;
            text-align: center;
        }

        * {
            box-sizing: border-box;
        }

        .responsive {
            margin: 32px 32px;
            float: left;
            width: 33.33%;
        }

        @media screen and (max-width: 600px) {
            .topnav a:not(:first-child) {
                display: none;
            }

            .topnav a.icon {
                float: right;
                display: block;
            }

            .topnav.responsive {
                position: relative;
            }

            .topnav.responsive .icon {
                position: absolute;
                right: 0;
                top: 0;
            }

            .topnav.responsive a {
                float: none;
                display: block;
                text-align: left;
            }
        }

        @media only screen and (max-width: 700px) {
            .responsive {
                width: 49.99999%;
                
            }
        }

        @media only screen and (max-width: 500px) {
            .responsive {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="topnav" id="myTopnav">
                <a>Colmar Academy</a>
                <a href="javascript:void(0);" class="icon" onclick="myFunction()">
                    <i class="fa fa-bars"></i>
                </a>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="class1">

            </div>
        </section>
        <section class="infomation">
            <div class="class2">
                <div class="responsive">
                    <div class="gallery">
                        <a target="_blank" href="img_5terre.jpg">
                            <img src="img_5terre.jpg" alt="Cinque Terre" width="600" height="400">
                        </a>
                        <div class="desc">Add a description of the image here</div>
                    </div>
                </div>


                <div class="responsive">
                    <div class="gallery">
                        <a target="_blank" href="img_forest.jpg">
                            <img src="img_forest.jpg" alt="Forest" width="600" height="400">
                        </a>
                        <div class="desc">Add a description of the image here</div>
                    </div>
                </div>

                <div class="responsive">
                    <div class="gallery">
                        <a target="_blank" href="img_lights.jpg">
                            <img src="img_lights.jpg" alt="Northern Lights" width="600" height="400">
                        </a>
                        <div class="desc">Add a description of the image here</div>
                    </div>
                </div>

                <div class="responsive">
                    <div class="gallery">
                        <a target="_blank" href="img_5terre.jpg">
                            <img src="img_5terre.jpg" alt="Cinque Terre" width="600" height="400">
                        </a>
                        <div class="desc">Add a description of the image here</div>
                    </div>
                </div>


                <div class="responsive">
                    <div class="gallery">
                        <a target="_blank" href="img_forest.jpg">
                            <img src="img_forest.jpg" alt="Forest" width="600" height="400">
                        </a>
                        <div class="desc">Add a description of the image here</div>
                    </div>
                </div>

                <div class="responsive">
                    <div class="gallery">
                        <a target="_blank" href="img_lights.jpg">
                            <img src="img_lights.jpg" alt="Northern Lights" width="600" height="400">
                        </a>
                        <div class="desc">Add a description of the image here</div>
                    </div>
                </div>
            </div>
        </section>
        <section class="course">
            <div>

            </div>
        </section>
        <section class="thesis">
            <div>

            </div>
        </section>
    </main>

    <footer>
        <div>

        </div>
    </footer>

    <script>
        function myFunction() {
            var x = document.getElementById("myTopnav");
            if (x.className === "topnav") {
                x.className += " responsive";
            } else {
                x.className = "topnav";
            }
        }
    </script>
</body>

</html>
